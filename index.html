<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#030401">
  <meta name="description" content="Unofficial terminal UI recreation. Frontend-only interactive demo. No connection to the original service.">
  <title>STAR.CORE / TERMINAL DEMO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--acid:#d6ff00;--low:#819900;--dark:#040600;--faint:#334100;--red:#ff5050;--mono:"IBM Plex Mono", "Courier New", monospace}
    *{box-sizing:border-box}html,body{min-width:320px;height:100%;margin:0}body{background:#010200;color:var(--acid);font-family:var(--mono);font-size:14px;line-height:1.72;font-weight:400;letter-spacing:.055em;-webkit-font-smoothing:none}button,input{font:inherit;letter-spacing:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:1px solid var(--acid);outline-offset:5px}button:disabled{cursor:default;opacity:.45}::selection{background:var(--acid);color:#000}
    .stage{position:relative;min-height:100dvh;background:#020301;isolation:isolate;overflow:hidden}.stage::before{content:"";position:fixed;inset:0;z-index:-1;opacity:.21;pointer-events:none;background-image:url('data:image/svg+xml,%3Csvg viewBox=%220 0 160 160%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22n%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%22.86%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23n)%22 opacity=%22.2%22/%3E%3C/svg%3E');mix-blend-mode:screen}.stage::after{content:"";position:fixed;inset:0;z-index:10;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.03) 0,rgba(0,0,0,.03) 1px,transparent 1px,transparent 3px);opacity:.6}
    .edge{position:absolute;z-index:20;left:14px;right:14px;display:flex;align-items:center;justify-content:space-between;line-height:1.28;font-size:13px;letter-spacing:.06em;white-space:nowrap}.edge.top{top:12px}.edge.bottom{bottom:12px}.pill{display:inline-block;background:var(--acid);color:#090e00;padding:2px 7px 1px;line-height:1.15;text-transform:uppercase}.speaker{position:absolute;top:12px;left:50%;z-index:23;transform:translateX(-50%);width:44px;height:19px;display:flex;align-items:center;justify-content:center;border:0;background:var(--acid);color:#0c1200;padding:0}.speaker svg{height:12px;width:14px}.speaker.off{background:#596800;color:#d4fd00}
    .corner-right{max-width:50%;overflow:hidden;text-overflow:ellipsis}.center{position:relative;width:100%;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:90px 25px}.scene{width:100%;animation:fade .2s ease}.boot{width:382px;max-width:100%;transform:translateY(22px)}.boot-logs{text-transform:uppercase;white-space:nowrap;line-height:1.7;letter-spacing:.062em;font-size:14px}.boot-logs p{margin:0;animation:appear .25s ease both}.boot-logs p:nth-child(2){animation-delay:.08s}.boot-logs p:nth-child(3){animation-delay:.16s}.boot-logs p:nth-child(4){animation-delay:.24s}.boot-actions{text-align:center;margin-top:19px}.bracket{background:var(--acid);color:#071100;border:0;padding:3px 8px;line-height:1.25;text-transform:uppercase;font-size:14px}.bracket:hover,.bracket:focus-visible{background:#f0ff94}.bracket.ghost{background:transparent;color:var(--acid);border:1px solid var(--acid)}.bracket.ghost:hover{background:var(--acid);color:#000}.blink{animation:blink 1s steps(1) infinite}
    .access{width:520px;max-width:100%;text-align:center;transform:translateY(8px)}.access-head{text-transform:uppercase;margin:0 0 30px}.access-title{font-size:19px;letter-spacing:.12em;margin-bottom:8px}.signal{height:50px;margin:4px auto 22px;max-width:410px;display:flex;align-items:center;justify-content:space-between;opacity:.6}.signal:before,.signal:after{content:'+';font-size:30px;line-height:1}.signal i{display:block;height:1px;width:69%;background:repeating-linear-gradient(90deg,var(--acid) 0 8px,transparent 8px 12px)}.card-frame{margin:0 auto;max-width:420px;border:1px solid var(--low);padding:23px 24px 18px;background:rgba(8,12,0,.25);position:relative}.card-frame::before,.card-frame::after{content:'+';position:absolute;color:var(--acid);font-size:22px}.card-frame::before{top:-18px;left:-8px}.card-frame::after{right:-8px;bottom:-20px}.card-title{text-transform:uppercase;letter-spacing:.1em;margin:0 0 22px}.card-title strong{font-weight:500}.card-instructions{color:var(--low);text-transform:uppercase;font-size:12px;margin-bottom:16px}.id-entry{position:relative;max-width:330px;display:flex;justify-content:space-between;gap:6px;margin:0 auto 17px;cursor:text}.id-slot{flex:1;min-width:0;height:43px;display:grid;place-items:center;border-bottom:1px solid var(--acid);background:rgba(214,255,0,.045);font-size:22px}.id-slot.filled{background:rgba(214,255,0,.13)}.id-slot.active{box-shadow:inset 0 -2px 0 var(--acid)}.id-native{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:text;text-transform:uppercase}.access-status{min-height:25px;color:var(--low);font-size:12px;margin:13px 0 0}.access-status.error{color:var(--red)}.access-actions{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:20px}.footnote{color:var(--low);font-size:11px;text-transform:uppercase;margin-top:17px}
    .term{width:830px;max-width:100%;min-height:490px;display:flex;flex-direction:column;gap:0;transform:translateY(5px)}.term-head{display:flex;justify-content:space-between;gap:18px;border-bottom:1px solid var(--acid);padding:0 0 10px;text-transform:uppercase}.term-head small{font-size:11px;color:var(--low)}.term-head-right{text-align:right}.terminal-output{flex:1;min-height:225px;max-height:54vh;overflow:auto;scrollbar-color:var(--acid) #111900;padding:28px 0 20px;font-size:13px;line-height:1.85}.line{white-space:pre-wrap;overflow-wrap:anywhere}.line.dim{color:var(--low)}.line.red{color:var(--red)}.line.indent{padding-left:15px}.term-input-row{display:flex;align-items:center;gap:9px;border-top:1px solid var(--low);padding:12px 0}.term-input-row input{width:100%;border:0;background:transparent;outline:none;color:var(--acid);text-transform:none;caret-color:var(--acid);font-size:14px}.term-input-row input:focus{outline:none}.terminal-info{display:flex;justify-content:space-between;gap:15px;color:var(--low);text-transform:uppercase;font-size:11px;padding-top:5px}.keyword{color:var(--acid)}
    .form-scene{width:590px;max-width:100%;transform:translateY(5px)}.form-head{border-bottom:1px solid var(--acid);padding-bottom:13px;display:flex;justify-content:space-between;align-items:center;gap:10px;text-transform:uppercase}.form-head small{color:var(--low);font-size:11px}.form-title{font-size:27px;font-weight:400;letter-spacing:.03em;line-height:1.25;margin:27px 0 9px;text-transform:uppercase}.form-sub{color:var(--low);font-size:12px;margin:0 0 28px;text-transform:uppercase}.form{max-width:510px}.field{margin-bottom:18px}.field label{display:block;font-size:12px;text-transform:uppercase;margin:0 0 7px}.field input{width:100%;height:45px;background:rgba(214,255,0,.03);border:1px solid #617500;color:var(--acid);padding:10px 12px;outline:none;border-radius:0}.field input:focus{border-color:var(--acid);box-shadow:0 0 0 1px var(--acid)}.field input::placeholder{color:#718600}.form-actions{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:28px;flex-wrap:wrap}.plain{border:0;background:transparent;color:var(--acid);text-decoration:underline;text-underline-offset:4px;font-size:12px;padding:7px 0}.plain:hover{color:#fff}.alert{margin-top:18px;min-height:22px;text-transform:uppercase;font-size:12px;color:var(--low)}.alert.error{color:var(--red)}.alert.success{color:var(--acid)}.demo-note{margin-top:25px;color:var(--low);font-size:11px;border-top:1px solid #334000;padding-top:11px;text-transform:uppercase}.verified{text-align:center;max-width:570px}.verified-mark{font-size:65px;line-height:1}.verified h1{font-size:26px;font-weight:400;letter-spacing:.16em;margin:20px 0 10px}.verified p{color:var(--low);font-size:12px;line-height:1.8}.verified .bracket{margin:26px 0 0}
    .demo-tag{position:fixed;z-index:21;bottom:37px;left:50%;transform:translateX(-50%);white-space:nowrap;color:#5e7500;font-size:9px;letter-spacing:.07em;text-transform:uppercase;text-align:center}.utility{display:flex;gap:16px;justify-content:center;margin-top:17px}.utility button{background:none;color:#7e9900;border:none;font-size:11px;text-transform:uppercase;padding:0}.utility button:hover{color:var(--acid)}
    @keyframes appear{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}@keyframes fade{from{opacity:.1}to{opacity:1}}@keyframes blink{50%{opacity:0}}
    @media(max-width:650px){body{font-size:11px}.edge{font-size:9px;left:9px;right:9px}.edge.top{top:10px}.edge.bottom{bottom:10px}.pill{padding:3px 4px 2px}.speaker{top:10px}.center{padding:77px 20px}.boot{width:100%;max-width:350px;transform:translateY(10px)}.boot-logs{font-size:10px;letter-spacing:.0em;line-height:1.95}.bracket{font-size:12px}.access-title{font-size:15px}.card-frame{padding:19px 15px}.card-title{font-size:12px}.id-slot{height:38px;font-size:17px}.term{min-height:450px}.term-head{font-size:11px}.terminal-output{font-size:11px;max-height:53vh}.term-input-row input{font-size:13px}.form-title{font-size:20px}.form-head{font-size:11px}.demo-tag{bottom:32px;font-size:8px;max-width:90%;white-space:normal;line-height:1.3}.card-instructions{font-size:10px}.verified h1{font-size:19px}}
    @media(max-width:380px){.edge .corner-right{display:none}.boot-logs{font-size:9px}.center{padding-inline:12px}.form-title{font-size:18px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
<div class="stage">
  <div class="edge top"><span class="pill" id="top-left">OPENING CONNECTION TO SERVER 0.4.5-23</span><span class="pill corner-right" id="top-right">931.461.0337</span></div>
  <button class="speaker" type="button" id="mute" aria-label="Toggle sound" title="Toggle sound"><svg viewBox="0 0 12 10" fill="currentColor" aria-hidden="true"><polygon points="0,3 0,7 3,7 6,10 6,0 3,3"></polygon><path d="M8,3 Q10,5 8,7 M9.5,1.5 Q12.5,5 9.5,8.5" fill="none" stroke="currentColor" stroke-width="1"></path></svg></button>
  <div class="edge bottom"><span class="pill">CAS.TERM/CYBERACME SYSTEMS, INC.</span><span class="pill corner-right">&lt;931.461.60231.14.VT920&gt;</span></div>
  <main class="center" id="app" aria-live="polite"></main>
  <div class="demo-tag">UNOFFICIAL UI RECREATION · LOCAL DEMO · NO REAL AUTHENTICATION</div>
</div>
<script>
(()=>{
  'use strict';
  const app=document.getElementById('app');
  const stageName=document.getElementById('top-left');
  const accessKey='HATSUNE';
  const demoUsername='operator';
  const demoPassword='starcore';
  const demoVerifyCode='042623';
  let view='boot', muted=false,history=[],lastNotice='',registeredName='';
  const escape=(v)=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  function setView(name){view=name;stageName.textContent={boot:'OPENING CONNECTION TO SERVER 0.4.5-23',access:'DATA ACCESS CARD VERIFICATION',terminal:'SECURE CHANNEL ESTABLISHED',login:'AUTHENTICATION / USER LOGIN',register:'AUTHENTICATION / NEW USER',verify:'AUTHENTICATION / VERIFICATION',success:'AUTHENTICATION / ACCESS GRANTED'}[name]||'STAR.CORE'; render()}
  function sound(){if(muted)return;try{const C=window.AudioContext||window.webkitAudioContext; if(!C)return;const ctx=new C(),osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='square';osc.frequency.setValueAtTime(740,ctx.currentTime);osc.frequency.exponentialRampToValueAtTime(375,ctx.currentTime+.065);gain.gain.setValueAtTime(.02,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.082);osc.connect(gain).connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.087);osc.onended=()=>ctx.close()}catch(e){}}
  const bind=(selector,cb)=>{const node=app.querySelector(selector);if(node)node.addEventListener('click',e=>{sound();cb(e)})};
  const focus=(selector)=>{const el=app.querySelector(selector);if(el)requestAnimationFrame(()=>el.focus())};
  function render(){
    if(view==='boot'){
      app.innerHTML='<section class="scene boot" aria-label="Boot sequence"><div class="boot-logs"><p>INITIALIZING SYSTEM BOOT SEQUENCE...</p><p>ESTABLISHING UPLINK TO UESC MAINFRAME...</p><p>ROUTING THROUGH SECURE CHANNELS...</p><p>STATUS: CONNECTION ESTABLISHED.</p></div><div class="boot-actions"><button type="button" class="bracket" id="transmit">[ TRANSMIT ]</button></div></section>';
      bind('#transmit',()=>setView('access'));
    }
    if(view==='access'){
      app.innerHTML='<section class="scene access" aria-label="Data access card"><div class="access-head"><div class="access-title">TERMINAL LOCKED</div><div>PRESENT DATA ACCESS CARD ID</div></div><div class="signal"><i></i></div><div class="card-frame"><div class="card-title">DATA ACCESS CARD <strong>/ UNIT 07</strong></div><div class="card-instructions">ENTER SEVEN-CHARACTER ACCESS KEY</div><div class="id-entry" id="id-wrap" role="group" aria-label="7 character card ID"><input class="id-native" id="card-id" type="text" maxlength="7" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Access card key"><span class="id-slot active">_</span><span class="id-slot">_</span><span class="id-slot">_</span><span class="id-slot">_</span><span class="id-slot">_</span><span class="id-slot">_</span><span class="id-slot">_</span></div><div class="footnote">PERSONAL USE ONLY</div><div class="access-status" id="access-status">AWAITING CREDENTIALS <span class="blink">_</span></div></div><div class="access-actions"><button class="bracket" id="verify-access">[ VERIFY ]</button></div><div class="utility"><button type="button" id="restart">RESTART</button><button type="button" id="hint">DEMO KEY HINT</button></div></section>';
      const field=app.querySelector('#card-id');
      function paint(){const val=field.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,7);if(field.value!==val)field.value=val;app.querySelectorAll('.id-slot').forEach((e,i)=>{e.textContent=val[i]||'_';e.className='id-slot'+(val[i]?' filled':'')+((i===val.length&&i<7)?' active':'')})}
      function verify(){paint();const st=app.querySelector('#access-status');if(field.value.toUpperCase()===accessKey){st.textContent='ID ACCEPTED. INITIALIZING SHELL...';st.className='access-status';setTimeout(()=>{if(view==='access'){history=[];push('STAR.CORE // SECURITY INTERFACE v0.4.5-23');push('SECURE UPLINK ESTABLISHED.','dim');push('CARD ID VERIFIED / CLEARANCE LEVEL: DEMO');push('');push('TYPE HELP TO LIST AVAILABLE COMMANDS.','dim');setView('terminal')}},650)}else{st.textContent='CARD ID REJECTED / TRY AGAIN';st.className='access-status error';field.select()}}
      field.addEventListener('input',paint);field.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sound();verify()}});bind('#verify-access',verify);bind('#restart',()=>setView('boot'));bind('#hint',()=>{const s=app.querySelector('#access-status');s.textContent='DEMO ACCESS KEY: HATSUNE';s.className='access-status'});focus('#card-id')
    }
    if(view==='terminal'){
      app.innerHTML='<section class="scene term" aria-label="Command terminal"><header class="term-head"><div>STAR.CORE <small>/ AUTHENTICATED TERMINAL</small></div><div class="term-head-right"><small>OPERATOR U-53A5</small><br>CONNECTION ACTIVE</div></header><div class="terminal-output" id="history" role="log" aria-label="Console output"></div><form id="command-form" class="term-input-row" autocomplete="off"><label for="command-line">&gt;</label><input id="command-line" aria-label="Terminal command" spellcheck="false" autocomplete="off" placeholder="ENTER COMMAND" maxlength="140"></form><footer class="terminal-info"><span>TYPE HELP FOR AVAILABLE COMMANDS</span><span>LOCAL DEMO MODE</span></footer></section>';
      const out=app.querySelector('#history');for(const item of history){const p=document.createElement('div');p.className='line'+(item.type?' '+item.type:'');p.textContent=item.text||' ';out.appendChild(p)}out.scrollTop=out.scrollHeight;
      app.querySelector('#command-form').addEventListener('submit',e=>{e.preventDefault();const field=app.querySelector('#command-line');const cmd=field.value.trim();if(!cmd)return;sound();push('> '+cmd);const name=cmd.toLowerCase();if(name==='login')return setView('login');if(name==='register'||name==='signup')return setView('register');if(name==='help'){push('AVAILABLE COMMANDS:','dim');['login       - sign into the demo','register    - create a demo account','clear       - clear terminal output','status      - inspect local uplink','whoami      - current operator','reboot      - restart terminal'].forEach(x=>push(x,'indent'))}else if(name==='clear'){history=[]}else if(name==='status'){push('CORE STATUS: ONLINE / ENVIRONMENT: BROWSER SANDBOX');push('NETWORK AUTH: DISABLED / EXTERNAL REQUESTS: NONE','dim')}else if(name==='whoami'){push('GUEST-OPERATOR / CARD: HATSUNE')}else if(name==='reboot'||name==='exit'){return setView('boot')}else{push('UNKNOWN COMMAND: '+cmd.toUpperCase(),'red');push('TYPE HELP FOR AVAILABLE COMMANDS.','dim')}render()});focus('#command-line')
    }
    if(view==='login'||view==='register'||view==='verify'){
      const isLogin=view==='login',isVerify=view==='verify';const title=isLogin?'USER AUTHENTICATION':isVerify?'CONFIRM REGISTRATION':'NEW USER REGISTRATION';
      const sub=isLogin?'ENTER YOUR TERMINAL CREDENTIALS':isVerify?'SIMULATED EMAIL CONFIRMATION — NO MESSAGE IS SENT':'SUBMIT A LOCAL DEMO REGISTRATION';
      const contents=isVerify?'<div class="field"><label for="verify-code">VERIFICATION CODE</label><input id="verify-code" type="text" inputmode="numeric" maxlength="6" placeholder="6-DIGIT DEMO CODE" required autocomplete="off"></div>':(isLogin?'<div class="field"><label for="identity">USER ID</label><input id="identity" type="text" autocomplete="username" placeholder="DEMO OPERATOR ID" required></div><div class="field"><label for="password">ACCESS PHRASE</label><input id="password" type="password" autocomplete="off" placeholder="ENTER ACCESS PHRASE" required></div>':'<div class="field"><label for="identity">OPERATOR ID</label><input id="identity" type="text" placeholder="CHOOSE DEMO CALLSIGN" maxlength="24" required autocomplete="off"></div><div class="field"><label for="email">EMAIL ADDRESS</label><input id="email" type="email" placeholder="EXAMPLE@TEST.INVALID" required autocomplete="off"></div><div class="field"><label for="password">ACCESS PHRASE</label><input id="password" type="password" minlength="6" placeholder="MINIMUM 6 CHARACTERS" required autocomplete="new-password"></div>');
      app.innerHTML='<section class="scene form-scene"><div class="form-head"><span>STAR.CORE / '+(isLogin?'LOGIN':isVerify?'VERIFY':'REGISTER')+'</span><small>AUTH SYSTEM v0.4.5-23</small></div><h1 class="form-title">'+title+'</h1><p class="form-sub">'+sub+'</p><form class="form" id="auth-form" autocomplete="off">'+contents+'<div class="form-actions"><button type="button" class="plain" id="back-to-terminal">&lt; RETURN TO TERMINAL</button><button class="bracket" type="submit">['+(isLogin?' AUTHENTICATE ':isVerify?' VERIFY ': ' REGISTER ')+']</button></div><p class="alert" id="auth-alert" role="status"></p></form><p class="demo-note">UNOFFICIAL STATIC DEMO. INPUTS STAY IN THIS PAGE ONLY. NEVER ENTER REAL CREDENTIALS.<br>'+ (isLogin?'DEMO ID: OPERATOR &nbsp;/&nbsp; DEMO PHRASE: STARCORE':isVerify?'DEMO VERIFICATION CODE: 042623':'NO ACCOUNT IS CREATED. EMAIL DELIVERY IS NOT ENABLED.')+'</p></section>';
      bind('#back-to-terminal',()=>setView('terminal'));
      app.querySelector('#auth-form').addEventListener('submit',e=>{e.preventDefault();sound();const alert=app.querySelector('#auth-alert');alert.className='alert';if(isVerify){if(app.querySelector('#verify-code').value.trim()===demoVerifyCode){setView('success')}else{alert.textContent='INVALID DEMO VERIFICATION CODE';alert.classList.add('error')}return}if(isLogin){const id=app.querySelector('#identity').value.trim(),password=app.querySelector('#password').value;if(id.toLowerCase()===demoUsername&&password===demoPassword){registeredName='OPERATOR';setView('success')}else{alert.textContent='ACCESS DENIED / USE THE DEMO CREDENTIALS SHOWN BELOW';alert.classList.add('error')}return}const id=app.querySelector('#identity').value.trim();const email=app.querySelector('#email').value.trim();const password=app.querySelector('#password').value;if(!/^[a-z\d_-]{3,24}$/i.test(id)){alert.textContent='OPERATOR ID: 3–24 LETTERS, NUMBERS, _ OR -';alert.classList.add('error')}else if(!email.includes('@')){alert.textContent='INVALID EMAIL FORMAT';alert.classList.add('error')}else if(password.length<6){alert.textContent='ACCESS PHRASE TOO SHORT';alert.classList.add('error')}else{registeredName=id.toUpperCase();setView('verify')}});focus('#'+(isVerify?'verify-code':'identity'))
    }
    if(view==='success'){
      app.innerHTML='<section class="scene verified"><div class="verified-mark">✳</div><h1>ACCESS GRANTED</h1><p>USER PROFILE ACTIVATED.<br>SESSION: '+escape(registeredName||'OPERATOR')+'<br>SIMULATED AUTHENTICATION COMPLETE.<br>NO REAL SESSION WAS CREATED.</p><button type="button" class="bracket" id="return-terminal">[ RETURN TO TERMINAL ]</button><div class="utility"><button id="logoff" type="button">LOG OUT</button></div></section>';
      bind('#return-terminal',()=>setView('terminal'));bind('#logoff',()=>setView('boot'))
    }
  }
  function push(text,type=''){history.push({text,type});if(history.length>120)history.shift()}
  const mute=document.getElementById('mute');mute.addEventListener('click',()=>{muted=!muted;mute.classList.toggle('off',muted);mute.title=muted?'Unmute':'Mute';mute.setAttribute('aria-label',muted?'Unmute':'Mute');mute.style.opacity=muted?'.55':'1'});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(['login','register','verify'].includes(view)){setView('terminal')}else if(view==='success'){setView('terminal')}}});
  const hash=window.location.hash.slice(1).toLowerCase();if(['access','terminal','login','register'].includes(hash)){if(hash==='terminal'||hash==='login'||hash==='register'){push('STAR.CORE // DEMONSTRATION TERMINAL');push('TYPE HELP TO LIST AVAILABLE COMMANDS.','dim')}setView(hash)}else render();
})();
</script>
</body>
</html>
